name: Quotenvergleich-Portal

on:
  schedule:
    - cron: "7,37 * * * *"        # alle 30 Minuten (GitHub startet geplante Läufe oft ein paar Minuten später)
  workflow_dispatch: {}           # manuell starten: Actions -> Quotenvergleich-Portal -> Run workflow

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: odds-portal
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Solange die Secrets fehlen, wird still übersprungen (keine Fehler-Mails alle 30 Minuten)
      - name: Einrichtung prüfen
        id: check
        env:
          K: ${{ secrets.ODDSPAPI_KEY }}
          P: ${{ secrets.PORTAL_PASSWORD }}
        run: |
          if [ -n "$K" ] && [ -n "$P" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Secrets ODDSPAPI_KEY und PORTAL_PASSWORD fehlen noch – Lauf übersprungen (siehe README)."
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-python@v5
        if: steps.check.outputs.ready == 'true'
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        if: steps.check.outputs.ready == 'true'
        run: pip install cryptography==43.0.3

      # Zustand zwischen den Läufen (Tipp-Zuordnungen, Quoten, Budget-Zähler). Wird nie ins Repo geschrieben.
      - name: Zustand laden
        if: steps.check.outputs.ready == 'true'
        uses: actions/cache/restore@v4
        with:
          path: portal/state
          key: portal-state-${{ github.run_id }}
          restore-keys: portal-state-

      - name: Quoten abrufen und Portal bauen
        if: steps.check.outputs.ready == 'true'
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          PORTAL_PASSWORD: ${{ secrets.PORTAL_PASSWORD }}
          SHEET_WEBAPP_URL: ${{ secrets.SHEET_WEBAPP_URL }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
          TIPS_CSV_URL: ${{ secrets.TIPS_CSV_URL }}
          STATE_DIR: portal/state
          OUT_DIR: site/data
        run: python portal/fetch.py

      - name: Zustand speichern
        if: always() && steps.check.outputs.ready == 'true'
        uses: actions/cache/save@v4
        with:
          path: portal/state
          key: portal-state-${{ github.run_id }}

      - uses: actions/configure-pages@v5
        if: steps.check.outputs.ready == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.ready == 'true'
        with:
          path: site

      - id: deploy
        if: steps.check.outputs.ready == 'true'
        uses: actions/deploy-pages@v4
